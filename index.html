<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Metadata Repository · How does that work?</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="page">
        <header class="hero">
            <h1>Metadata Repository</h1>
            <p class="subtitle">How does that work?</p>
        </header>

        <div class="ask-wrap">
            <form id="ask-form" class="ask" role="search" autocomplete="off">
                <label for="ask-input" class="visually-hidden">Ask a question</label>
                <input id="ask-input" type="text" enterkeyhint="search" placeholder="e.g. What is the tech stack?  ·  type help for all questions" spellcheck="false" autofocus
                       role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest" aria-haspopup="listbox">
                <button type="button" id="clear-btn" class="clear-btn" aria-label="Clear question and answer" title="Clear (Esc)" hidden>&times;</button>
                <span class="ask-divider" aria-hidden="true"></span>
                <button type="submit" class="ask-btn">Ask</button>
            </form>
            <ul id="suggest" class="suggest" role="listbox" aria-label="Suggested questions" hidden></ul>
        </div>

        <div id="answer" class="answer" aria-live="polite"></div>
        <noscript><p class="quiet">Turn on JavaScript to use this page.</p></noscript>
    </main>

    <script src="data/topics.js"></script>
    <script src="data/topics-technical.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
